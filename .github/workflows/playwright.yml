
name: Playwright Sharded Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: Select execution environment
        type: choice
        options:
          - QA
          - UAT
          - PROD
        default: QA
        required: true

      project:
        description: Select browser project
        type: choice
        options:
          - all
          - chromium
          - microsoft edge
          - firefox
          - webkit
          - Mobile Chrome
          - Mobile Safari
        default: chromium
        required: true

      workers:
        description: Workers per runner
        type: choice
        options:
          - '1'
          - '2'
          - '4'
          - '6'
        default: '4'
        required: true

      shard_count:
        description: Number of shards
        type: choice
        options:
          - '2'
          - '4'
          - '6'
        default: '4'
        required: true

permissions:
  contents: read

jobs:

  # =================================
  # JOB 1: PREPARE SHARD MATRIX
  # =================================

  prepare:
    name: Prepare Shards
    runs-on: ubuntu-latest

    outputs:
      shards: ${{ steps.set.outputs.shards }}
      shard_count: ${{ steps.set.outputs.shard_count }}

    steps:
      - name: Generate shard indexes
        id: set
        shell: bash
        run: |
          COUNT="${{ inputs.shard_count || '4' }}"
          SHARDS=$(seq -s, 1 "$COUNT")

          echo "shards=[$SHARDS]" >> "$GITHUB_OUTPUT"
          echo "shard_count=$COUNT" >> "$GITHUB_OUTPUT"

  # =================================
  # JOB 2: PLAYWRIGHT EXECUTION
  # =================================

  playwright-tests:
    name: Shard ${{ matrix.shardIndex }}/${{ needs.prepare.outputs.shard_count }}
    runs-on: ubuntu-latest

    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        shardIndex: ${{ fromJson(needs.prepare.outputs.shards) }}

    env:
      TEST_ENV: ${{ inputs.environment || 'QA' }}
      PW_PROJECT: ${{ inputs.project || 'chromium' }}
      PW_WORKERS: ${{ inputs.workers || '4' }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Install branded Microsoft Edge when selected
      - name: Install Microsoft Edge
        if: ${{ env.PW_PROJECT == 'microsoft edge' || env.PW_PROJECT == 'all' }}
        run: npx playwright install msedge

      # Execute selected project or all projects
      - name: Run Playwright Tests
        shell: bash
        run: |
          if [ "$PW_PROJECT" = "all" ]; then

            npx playwright test \
              --workers="$PW_WORKERS" \
              --shard=${{ matrix.shardIndex }}/${{ needs.prepare.outputs.shard_count }} \
              --reporter=blob

          else

            npx playwright test \
              --project="$PW_PROJECT" \
              --workers="$PW_WORKERS" \
              --shard=${{ matrix.shardIndex }}/${{ needs.prepare.outputs.shard_count }} \
              --reporter=blob

          fi

      # Upload each shard report
      - name: Upload Blob Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: warn

  # =================================
  # JOB 3: MERGE REPORTS
  # =================================

  merge-reports:
    name: Merge Playwright Reports
    runs-on: ubuntu-latest

    needs:
      - prepare
      - playwright-tests

    if: ${{ !cancelled() }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Collect reports from all available shards
      - name: Download Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # Generate consolidated HTML report
      - name: Merge Reports
        run: |
          npx playwright merge-reports \
            --reporter html \
            ./all-blob-reports

      # Upload final report
      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

  # =================================
  # JOB 4: GITHUB PAGES DEPLOYMENT
  # =================================

  deploy-report:
    name: Publish Playwright Report
    runs-on: ubuntu-latest

    needs: merge-reports

    if: ${{ needs.merge-reports.result == 'success' && github.event_name != 'pull_request' }}

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Download HTML Report
        uses: actions/download-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
