
name: Playwright Sharded Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Playwright Shard ${{ matrix.shardIndex }}/4
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 5. Execute tests in 4 shards
      - name: Run Playwright Tests
        run: |
          npx playwright test \
            --shard=${{ matrix.shardIndex }}/4 \
            --reporter=blob

      # 6. Upload individual shard reports
      - name: Upload Blob Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7

  # Merge all 4 shard reports
  merge-reports:
    name: Merge Playwright Reports
    runs-on: ubuntu-latest
    needs: playwright-tests
    if: ${{ !cancelled() }}

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Download all shard reports
      - name: Download Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # 5. Merge reports into one HTML report
      - name: Merge Reports
        run: |
          npx playwright merge-reports \
            --reporter html \
            ./all-blob-reports

      # 6. Upload final HTML report
      - name: Upload HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14
